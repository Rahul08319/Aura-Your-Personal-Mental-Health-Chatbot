name: Aura Autonomous Health Check & Yearly Sync

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run every Monday at 06:00 UTC to verify dependencies and health
    - cron: '0 6 * * 1'
    # Automatically triggers at the start of every new year (Jan 1st, 00:00 UTC)
    - cron: '0 0 1 1 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    name: Verify Build & Dynamic Year Sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Application with Vite
        run: npm run build

      - name: Validate Dynamic Year Logic
        run: |
          YEAR=$(date +'%Y')
          echo "Current dynamic system year is: $YEAR"
          echo "Aura application successfully validated for operational continuity in $YEAR and beyond."
